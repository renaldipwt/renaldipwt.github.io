<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Share & OCR Tool</title>

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 15px;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
    }
    img {
      margin-top: 15px;
      max-width: 100%;
      border-radius: 8px;
      display: none;
    }
    .form-group {
      text-align: left;
      margin-top: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 15px;
    }
    small {
      color: #666;
      font-size: 12px;
      display: block;
      margin-top: 4px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #result {
      margin-top: 20px;
      padding: 10px;
      background: #e9ecef;
      border-radius: 5px;
      white-space: pre-wrap;
      font-family: monospace;
      text-align: left;
      font-size: 14px;
      display: none;
    }
    #status {
      font-weight: bold;
      color: #28a745;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📥 Input Data & OCR</h2>
  <p id="status">Menunggu kiriman file/teks...</p>

  <img id="preview" alt="Preview Gambar"/>

  <div class="form-group">
    <label for="nama-user">Nama User (Pelanggan):</label>
    <input type="text" id="nama-user" placeholder="Ketik nama pelanggan...">
  </div>

  <div class="form-group">
    <label for="nama-teknisi">Nama Teknisi (Pilih Sekali):</label>
    <select id="nama-teknisi" onchange="saveTeknisiSettings()">
      <option value="">-- Pilih Teknisi --</option>
      <option value="Ipul">Ipul</option>
      <option value="Tofik">Tofik</option>
      <option value="Sarif">Sarif</option>
      <option value="Dion">Dion</option>
      <option value="Difa">Difa</option>
      <option value="Hendra">Hendra</option>
      <option value="Alvi">Alvi</option>
      <option value="Ifan">Ifan</option>
    </select>
    <small>Data teknisi akan tersimpan otomatis di HP ini.</small>
  </div>

  <div class="form-group">
    <label for="key-office">Key Office:</label>
    <input type="text" id="key-office" placeholder="Tempel/Share key di sini...">
  </div>

  <button id="btn-scan" onclick="prosesData()">Kirim ke Spreadsheet</button>
  <small>Renaldi - Teknisi Support - Els Purwokerto - v0.2 (Google OCR)</small>
  <div id="result"></div>
</div>

<script>
  let currentBlob = null;

  // 1. FUNGSI AMBIL DATA DARI CACHE (KIRIMAN SHARE)
  async function loadSharedData() {
    try {
      const cache = await caches.open('shared-files');
      
      const imgRes = await cache.match('/shared-image');
      if (imgRes) {
        currentBlob = await imgRes.blob();
        const preview = document.getElementById('preview');
        preview.src = URL.createObjectURL(currentBlob);
        preview.style.display = 'block';
        document.getElementById('status').innerText = "✅ Gambar diterima! Siap scan.";
        await cache.delete('/shared-image');
      }

      const txtRes = await cache.match('/shared-text');
      if (txtRes) {
        const sharedText = await txtRes.text();
        document.getElementById('key-office').value = sharedText.trim();
        document.getElementById('status').innerText = "✅ Teks otomatis masuk ke Key Office!";
        await cache.delete('/shared-text');
      }
    } catch (error) {
      console.error("Gagal load dari cache:", error);
    }
  }

  // 2. FUNGSI MEMORI TEKNISI (LOCAL STORAGE)
  function saveTeknisiSettings() {
    const selectedTeknisi = document.getElementById('nama-teknisi').value;
    localStorage.setItem('savedTeknisi', selectedTeknisi);
  }

  function loadTeknisiSettings() {
    const savedName = localStorage.getItem('savedTeknisi');
    if (savedName) {
      document.getElementById('nama-teknisi').value = savedName;
    }
  }

  // 3. FUNGSI RESET FORM SETELAH BERHASIL
  function resetForm() {
    document.getElementById('nama-user').value = '';
    document.getElementById('key-office').value = '';
    
    const preview = document.getElementById('preview');
    preview.style.display = 'none';
    preview.src = '';
    currentBlob = null;

    document.getElementById('status').innerText = "Menunggu data selanjutnya...";
    
    setTimeout(() => {
      document.getElementById('result').style.display = 'none';
    }, 5000);
  }

  // 4. HELPER: CONVERT BLOB KE BASE64
  function blobToBase64(blob) {
    return new Promise((resolve, _) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result.split(',')[1]);
      reader.readAsDataURL(blob);
    });
  }

  // 5. FUNGSI UTAMA (PROSES DATA & KIRIM KE GAS)
  async function prosesData() {
    const btn = document.getElementById('btn-scan');
    const resultDiv = document.getElementById('result');
    const namaUser = document.getElementById('nama-user').value.trim();
    const namaTeknisi = document.getElementById('nama-teknisi').value;
    const keyOffice = document.getElementById('key-office').value.trim();

    if (!namaUser) {
      alert("Harap isi Nama User (Pelanggan)!");
      return;
    }
    if (!namaTeknisi) {
      alert("Harap pilih Nama Teknisi!");
      return;
    }

    resultDiv.style.display = 'block';
    btn.disabled = true;
    resultDiv.innerText = "⏳ Memproses data...";

    let base64Image = "";
    let mimeType = "";

    if (currentBlob) {
      resultDiv.innerText = "⏳ Mengubah gambar & mengirim ke Google Server...";
      base64Image = await blobToBase64(currentBlob);
      mimeType = currentBlob.type;
    }

    // GANTI URL DI BAWAH INI DENGAN URL WEB APP GAS KAMU
    const urlGAS = "https://script.google.com/macros/s/AKfycbyEi0lAsdGQVzsmwY2-x6xNd3EdIV4ZFLcJ86dqNZ7hTXxtonBLMbtOJx1Gv8bd3MPA/exec"; 

    try {
      const res = await fetch(urlGAS, {
        method: "POST",
        body: JSON.stringify({
          nama: namaUser,
          teknisi: namaTeknisi,
          keyOffice: keyOffice,
          imageB64: base64Image,
          mimeType: mimeType
        })
      });
      
      const responseGAS = await res.json();

      if (responseGAS.status === "success") {
        if (responseGAS.keysDitemukan && responseGAS.keysDitemukan.length > 0) {
          resultDiv.innerText = "✅ Berhasil! KEY DITEMUKAN:\n" + responseGAS.keysDitemukan.join("\n") + "\n\nData tersimpan di Sheets.";
        } else if (base64Image !== "") {
          resultDiv.innerText = "⚠️ Google OCR tidak menemukan Key di gambar.\n\n✅ Tapi data lain berhasil disimpan di Sheets.";
        } else {
          resultDiv.innerText = "✅ Data manual berhasil disimpan di Sheets (Tanpa Gambar).";
        }
        resetForm();
      } else {
        resultDiv.innerText = "❌ Gagal menyimpan ke Sheets: " + responseGAS.message;
      }
    } catch (e) {
      resultDiv.innerText = "❌ Error Jaringan / Server GAS.";
      console.error(e);
    } finally {
      btn.disabled = false;
    }
  }

  window.onload = async () => {
    loadTeknisiSettings();
    await loadSharedData();
  };

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log("Service Worker Aktif"))
      .catch(err => console.error("SW Error:", err));
  }
</script>

</body>
</html>
